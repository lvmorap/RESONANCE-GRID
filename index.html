<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESONANCE GRID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.15), 0 0 120px rgba(255, 0, 170, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
    (() => {
        'use strict';

        // === CONSTANTS & CONFIG ===
        const CONFIG = {
            // Canvas
            CANVAS_WIDTH: 900,
            CANVAS_HEIGHT: 600,
            
            // Grid - adjusted for better fit
            GRID_COLS: 18,
            GRID_ROWS: 12,
            HEX_SIZE: 24,
            
            // Colors
            COLOR_BACKGROUND: '#050510',
            COLOR_GRID_LINE: '#1a1a3a',
            COLOR_PLAYER: '#00d4ff',
            COLOR_AI: '#ff00aa',
            COLOR_CONTESTED: '#7b2ff7',
            COLOR_RESONANCE: '#ffd700',
            COLOR_HUD: '#e0e0ff',
            COLOR_NEUTRAL: '#0a0a1a',
            
            // Timing (in ms)
            CELL_DECAY_TIME: 12000,
            CONTESTED_DECAY_TIME: 20000,
            ZONE_MOVE_INTERVAL: 15000,
            ZONE_MOVE_DURATION: 2000,
            SCORE_INTERVAL: 2000,
            AI_DECISION_INTERVAL: 400,
            PLAYER_MOVE_COOLDOWN: 167, // ~6 moves per second
            ENTITY_MOVE_DURATION: 100,
            
            // Scoring
            SOLO_SCORE: 1,
            HARMONY_SCORE: 3,
            ZONE_CONTROL_THRESHOLD: 0.8,
            
            // Match
            MATCH_DURATION: 120, // seconds
            
            // Entity
            ENTITY_SIZE: 14,
            TRAIL_LENGTH: 8,
            
            // Particles
            AMBIENT_PARTICLE_COUNT: 40,
            MAX_PARTICLES: 200,
            
            // Resonance Zone
            ZONE_CELLS: 7, // center + 6 surrounding
        };

        // === HEX GRID MATH ===
        const HEX_DIRECTIONS_ODD = [
            { dc: 1, dr: 0 },   // right
            { dc: 0, dr: -1 }, // up-right
            { dc: -1, dr: -1 },// up-left
            { dc: -1, dr: 0 }, // left
            { dc: -1, dr: 1 }, // down-left
            { dc: 0, dr: 1 },  // down-right
        ];
        
        const HEX_DIRECTIONS_EVEN = [
            { dc: 1, dr: 0 },   // right
            { dc: 1, dr: -1 }, // up-right
            { dc: 0, dr: -1 },// up-left
            { dc: -1, dr: 0 }, // left
            { dc: 0, dr: 1 }, // down-left
            { dc: 1, dr: 1 },  // down-right
        ];

        /** Convert hex grid coordinates to pixel position */
        function hexToPixel(col, row) {
            const size = CONFIG.HEX_SIZE;
            const width = size * 2;
            const height = Math.sqrt(3) * size;
            const offsetX = 50;
            const offsetY = 45;
            
            const x = offsetX + col * width * 0.75;
            const y = offsetY + row * height + (col % 2) * height / 2;
            
            return { x, y };
        }

        /** Get neighboring hex cells */
        function getNeighbors(col, row) {
            const directions = col % 2 === 1 ? HEX_DIRECTIONS_ODD : HEX_DIRECTIONS_EVEN;
            const neighbors = [];
            
            for (const dir of directions) {
                const nc = col + dir.dc;
                const nr = row + dir.dr;
                if (nc >= 0 && nc < CONFIG.GRID_COLS && nr >= 0 && nr < CONFIG.GRID_ROWS) {
                    neighbors.push({ col: nc, row: nr });
                }
            }
            return neighbors;
        }

        /** Calculate axial distance between two hex cells */
        function axialDistance(a, b) {
            const ac = a.col - (a.row - (a.row & 1)) / 2;
            const ar = a.row;
            const bc = b.col - (b.row - (b.row & 1)) / 2;
            const br = b.row;
            
            return (Math.abs(ac - bc) + Math.abs(ac + ar - bc - br) + Math.abs(ar - br)) / 2;
        }

        // === GAME STATE ===
        const state = {
            cells: [],
            player: null,
            ai: null,
            resonanceZone: null,
            scores: { player: 0, ai: 0 },
            timer: CONFIG.MATCH_DURATION,
            phase: 'start', // 'start' | 'countdown' | 'playing' | 'end'
            particles: [],
            floatingTexts: [],
            ambientParticles: [],
            lastTime: 0,
            countdownValue: 3,
            countdownTimer: 0,
            harmonyBonuses: { player: 0, ai: 0 },
            territoryClaimed: { player: 0, ai: 0 },
            gridPulse: 0,
            startScreenLetters: [],
            lastScoreCheck: 0,
            zoneStatus: 'NEUTRAL',
        };

        // === CELL CLASS ===
        class Cell {
            constructor(col, row) {
                this.col = col;
                this.row = row;
                this.owner = 'neutral'; // 'neutral' | 'player' | 'ai' | 'contested'
                this.lastVisited = 0;
                this.lastVisitor = null;
                this.decayTime = 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            /** Update cell state based on elapsed time */
            update(currentTime) {
                if (this.owner === 'neutral') return;
                
                const elapsed = currentTime - this.lastVisited;
                const maxTime = this.owner === 'contested' ? CONFIG.CONTESTED_DECAY_TIME : CONFIG.CELL_DECAY_TIME;
                
                if (elapsed > maxTime) {
                    if (this.owner === 'contested' && this.lastVisitor) {
                        this.owner = this.lastVisitor;
                        this.lastVisited = currentTime;
                    } else {
                        this.owner = 'neutral';
                    }
                }
            }

            /** Claim this cell for an entity */
            claim(owner, currentTime) {
                if (this.owner !== 'neutral' && this.owner !== owner && this.owner !== 'contested') {
                    this.owner = 'contested';
                } else if (this.owner !== 'contested') {
                    this.owner = owner;
                }
                this.lastVisited = currentTime;
                this.lastVisitor = owner;
            }
        }

        // === ENTITY CLASS ===
        class Entity {
            constructor(col, row, type) {
                this.col = col;
                this.row = row;
                this.type = type; // 'player' | 'ai'
                this.trail = [];
                this.targetCol = col;
                this.targetRow = row;
                this.moveProgress = 1;
                this.lastMoveTime = 0;
                this.rotation = 0;
                this.pulsePhase = 0;
            }

            /** Get current pixel position (interpolated during movement) */
            getPixelPosition() {
                if (this.moveProgress >= 1) {
                    return hexToPixel(this.col, this.row);
                }
                
                const start = hexToPixel(this.col, this.row);
                const end = hexToPixel(this.targetCol, this.targetRow);
                const t = this.easeInOut(this.moveProgress);
                
                return {
                    x: start.x + (end.x - start.x) * t,
                    y: start.y + (end.y - start.y) * t
                };
            }

            /** Ease in-out function for smooth movement */
            easeInOut(t) {
                return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            }

            /** Move to adjacent cell in direction */
            move(direction, currentTime) {
                if (this.moveProgress < 1) return false;
                if (currentTime - this.lastMoveTime < CONFIG.PLAYER_MOVE_COOLDOWN) return false;
                
                const neighbors = getNeighbors(this.col, this.row);
                let targetNeighbor = null;
                
                // Direction mapping for arrow keys
                const dirMap = {
                    'right': { dx: 1, dy: 0 },
                    'left': { dx: -1, dy: 0 },
                    'up': { dx: 0, dy: -1 },
                    'down': { dx: 0, dy: 1 }
                };
                
                const dir = dirMap[direction];
                if (!dir) return false;
                
                const currentPos = hexToPixel(this.col, this.row);
                let bestDist = Infinity;
                
                for (const n of neighbors) {
                    const nPos = hexToPixel(n.col, n.row);
                    const dx = nPos.x - currentPos.x;
                    const dy = nPos.y - currentPos.y;
                    
                    // Calculate how well this neighbor matches the desired direction
                    const dot = dx * dir.dx + dy * dir.dy;
                    if (dot > 0) {
                        const dist = Math.abs(dx - dir.dx * 50) + Math.abs(dy - dir.dy * 50);
                        if (dist < bestDist) {
                            bestDist = dist;
                            targetNeighbor = n;
                        }
                    }
                }
                
                if (targetNeighbor) {
                    return this.moveTo(targetNeighbor.col, targetNeighbor.row, currentTime);
                }
                return false;
            }

            /** Move to specific cell */
            moveTo(col, row, currentTime) {
                if (this.moveProgress < 1) return false;
                
                // Add current position to trail
                this.trail.unshift({ col: this.col, row: this.row });
                if (this.trail.length > CONFIG.TRAIL_LENGTH) {
                    this.trail.pop();
                }
                
                this.targetCol = col;
                this.targetRow = row;
                this.moveProgress = 0;
                this.lastMoveTime = currentTime;
                
                return true;
            }

            /** Update entity state */
            update(deltaTime, currentTime) {
                // Update movement progress
                if (this.moveProgress < 1) {
                    this.moveProgress += deltaTime / CONFIG.ENTITY_MOVE_DURATION;
                    if (this.moveProgress >= 1) {
                        this.moveProgress = 1;
                        this.col = this.targetCol;
                        this.row = this.targetRow;
                        
                        // Claim cell
                        const cell = state.cells[this.col][this.row];
                        cell.claim(this.type, currentTime);
                        
                        // Play sound
                        playSound('move');
                    }
                }
                
                // Update rotation and pulse
                this.rotation += deltaTime * 0.001;
                this.pulsePhase += deltaTime * 0.004;
            }

            /** Draw the entity */
            draw(ctx) {
                const pos = this.getPixelPosition();
                const color = this.type === 'player' ? CONFIG.COLOR_PLAYER : CONFIG.COLOR_AI;
                
                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const tPos = hexToPixel(t.col, t.row);
                    const alpha = (1 - i / this.trail.length) * 0.4;
                    
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(tPos.x, tPos.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                
                // Glow layers
                for (let i = 2; i >= 0; i--) {
                    ctx.save();
                    ctx.globalAlpha = 0.3 - i * 0.1;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 20 + i * 10;
                    ctx.fillStyle = color;
                    
                    if (this.type === 'player') {
                        this.drawHexagon(ctx, pos.x, pos.y, CONFIG.ENTITY_SIZE + i * 3);
                    } else {
                        this.drawOctagon(ctx, pos.x, pos.y, CONFIG.ENTITY_SIZE + i * 3);
                    }
                    ctx.restore();
                }
                
                // Main shape
                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = color;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                
                if (this.type === 'player') {
                    this.drawHexagon(ctx, pos.x, pos.y, CONFIG.ENTITY_SIZE);
                    ctx.fill();
                    ctx.stroke();
                    
                    // Orbiting triangles
                    for (let i = 0; i < 6; i++) {
                        const angle = this.rotation + (i / 6) * Math.PI * 2;
                        const tx = pos.x + Math.cos(angle) * (CONFIG.ENTITY_SIZE + 10);
                        const ty = pos.y + Math.sin(angle) * (CONFIG.ENTITY_SIZE + 10);
                        
                        ctx.save();
                        ctx.translate(tx, ty);
                        ctx.rotate(angle + Math.PI / 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(0, -4);
                        ctx.lineTo(-3, 3);
                        ctx.lineTo(3, 3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                } else {
                    this.drawOctagon(ctx, pos.x, pos.y, CONFIG.ENTITY_SIZE);
                    ctx.fill();
                    ctx.stroke();
                    
                    // Pulsing inner diamond
                    const scale = 0.5 + 0.5 * Math.sin(this.pulsePhase);
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = 0.7;
                    this.drawDiamond(ctx, pos.x, pos.y, CONFIG.ENTITY_SIZE * 0.5 * scale);
                    ctx.fill();
                }
                
                ctx.restore();
            }

            /** Draw hexagon shape */
            drawHexagon(ctx, x, y, size) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                    const px = x + Math.cos(angle) * size;
                    const py = y + Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
            }

            /** Draw octagon shape */
            drawOctagon(ctx, x, y, size) {
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 - Math.PI / 8;
                    const px = x + Math.cos(angle) * size;
                    const py = y + Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
            }

            /** Draw diamond shape */
            drawDiamond(ctx, x, y, size) {
                ctx.beginPath();
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size, y);
                ctx.lineTo(x, y + size);
                ctx.lineTo(x - size, y);
                ctx.closePath();
            }
        }

        // === AI BRAIN ===
        const AIState = {
            CLAIM_ZONE: 'CLAIM_ZONE',
            CONTEST: 'CONTEST',
            HARMONY_SEEK: 'HARMONY_SEEK',
            EXPLORE: 'EXPLORE'
        };

        const aiBrain = {
            currentState: AIState.CLAIM_ZONE,
            lastDecisionTime: 0,
            targetCell: null,

            /** Evaluate and choose AI state */
            evaluateState() {
                const zoneStats = getZoneStats();
                
                if (zoneStats.contested > 0.4) {
                    // Harmony is happening, maintain it
                    this.currentState = AIState.HARMONY_SEEK;
                } else if (zoneStats.player > 0.6) {
                    // Player has too much control, contest it
                    this.currentState = AIState.CONTEST;
                } else if (zoneStats.ai < 0.3) {
                    // Need more zone presence
                    this.currentState = AIState.CLAIM_ZONE;
                } else {
                    // Explore when comfortable
                    this.currentState = Math.random() < 0.3 ? AIState.EXPLORE : AIState.CLAIM_ZONE;
                }
            },

            /** A* pathfinding on hex grid */
            findPath(start, goal) {
                const openSet = [{ ...start, g: 0, h: axialDistance(start, goal), f: axialDistance(start, goal) }];
                const closedSet = new Set();
                const cameFrom = new Map();
                
                while (openSet.length > 0) {
                    // Get node with lowest f score
                    openSet.sort((a, b) => a.f - b.f);
                    const current = openSet.shift();
                    
                    if (current.col === goal.col && current.row === goal.row) {
                        // Reconstruct path
                        const path = [];
                        let node = `${goal.col},${goal.row}`;
                        while (cameFrom.has(node)) {
                            const [col, row] = node.split(',').map(Number);
                            path.unshift({ col, row });
                            node = cameFrom.get(node);
                        }
                        return path;
                    }
                    
                    closedSet.add(`${current.col},${current.row}`);
                    
                    const neighbors = getNeighbors(current.col, current.row);
                    for (const n of neighbors) {
                        const key = `${n.col},${n.row}`;
                        if (closedSet.has(key)) continue;
                        
                        const g = current.g + 1;
                        const h = axialDistance(n, goal);
                        const f = g + h;
                        
                        const existing = openSet.find(node => node.col === n.col && node.row === n.row);
                        if (!existing) {
                            openSet.push({ ...n, g, h, f });
                            cameFrom.set(key, `${current.col},${current.row}`);
                        } else if (g < existing.g) {
                            existing.g = g;
                            existing.f = f;
                            cameFrom.set(key, `${current.col},${current.row}`);
                        }
                    }
                }
                
                return [];
            },

            /** Choose next cell to move to */
            chooseNextCell(currentTime) {
                if (currentTime - this.lastDecisionTime < CONFIG.AI_DECISION_INTERVAL) {
                    return null;
                }
                this.lastDecisionTime = currentTime;
                
                this.evaluateState();
                
                const ai = state.ai;
                const zone = state.resonanceZone;
                let target = null;
                
                switch (this.currentState) {
                    case AIState.CLAIM_ZONE:
                        // Move toward zone center
                        target = { col: zone.centerCol, row: zone.centerRow };
                        break;
                        
                    case AIState.CONTEST:
                        // Find player-owned cell near zone
                        const playerCellsNearZone = zone.cells.filter(c => {
                            const cell = state.cells[c.col]?.[c.row];
                            return cell && cell.owner === 'player';
                        });
                        if (playerCellsNearZone.length > 0) {
                            target = playerCellsNearZone[Math.floor(Math.random() * playerCellsNearZone.length)];
                        } else {
                            target = { col: zone.centerCol, row: zone.centerRow };
                        }
                        break;
                        
                    case AIState.HARMONY_SEEK:
                        // Stay near zone but don't dominate
                        const neutralOrContestedInZone = zone.cells.filter(c => {
                            const cell = state.cells[c.col]?.[c.row];
                            return cell && (cell.owner === 'neutral' || cell.owner === 'contested');
                        });
                        if (neutralOrContestedInZone.length > 0) {
                            target = neutralOrContestedInZone[Math.floor(Math.random() * neutralOrContestedInZone.length)];
                        } else {
                            // Just move randomly near zone
                            const neighbors = getNeighbors(zone.centerCol, zone.centerRow);
                            if (neighbors.length > 0) {
                                target = neighbors[Math.floor(Math.random() * neighbors.length)];
                            }
                        }
                        break;
                        
                    case AIState.EXPLORE:
                        // Find neutral cells
                        const neutralCells = [];
                        for (let c = 0; c < CONFIG.GRID_COLS; c++) {
                            for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
                                if (state.cells[c][r].owner === 'neutral') {
                                    neutralCells.push({ col: c, row: r });
                                }
                            }
                        }
                        if (neutralCells.length > 0) {
                            // Pick a random neutral cell with some preference for nearby ones
                            neutralCells.sort((a, b) => {
                                return axialDistance(a, ai) - axialDistance(b, ai);
                            });
                            const idx = Math.floor(Math.random() * Math.min(5, neutralCells.length));
                            target = neutralCells[idx];
                        }
                        break;
                }
                
                if (!target) return null;
                
                // Add randomness to pathfinding (±15%)
                const path = this.findPath({ col: ai.col, row: ai.row }, target);
                
                if (path.length > 0) {
                    // Sometimes take a suboptimal path for unpredictability
                    if (Math.random() < 0.15) {
                        const neighbors = getNeighbors(ai.col, ai.row);
                        if (neighbors.length > 0) {
                            return neighbors[Math.floor(Math.random() * neighbors.length)];
                        }
                    }
                    return path[0];
                }
                
                // Fallback: random neighbor
                const neighbors = getNeighbors(ai.col, ai.row);
                if (neighbors.length > 0) {
                    return neighbors[Math.floor(Math.random() * neighbors.length)];
                }
                
                return null;
            }
        };

        /** Get zone ownership statistics */
        function getZoneStats() {
            const zone = state.resonanceZone;
            if (!zone) return { player: 0, ai: 0, contested: 0, neutral: 0 };
            
            let player = 0, ai = 0, contested = 0, neutral = 0;
            
            for (const c of zone.cells) {
                const cell = state.cells[c.col]?.[c.row];
                if (!cell) continue;
                
                switch (cell.owner) {
                    case 'player': player++; break;
                    case 'ai': ai++; break;
                    case 'contested': contested++; break;
                    default: neutral++; break;
                }
            }
            
            const total = zone.cells.length || 1;
            return {
                player: player / total,
                ai: ai / total,
                contested: contested / total,
                neutral: neutral / total
            };
        }

        // === PARTICLE SYSTEM ===
        class Particle {
            constructor(x, y, vx, vy, color, shape, lifetime, size) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.shape = shape; // 'circle' | 'triangle' | 'diamond'
                this.lifetime = lifetime;
                this.maxLifetime = lifetime;
                this.size = size;
                this.rotation = Math.random() * Math.PI * 2;
            }

            /** Update particle state */
            update(deltaTime) {
                this.x += this.vx * deltaTime;
                this.y += this.vy * deltaTime;
                this.lifetime -= deltaTime;
                this.rotation += deltaTime * 0.002;
            }

            /** Draw the particle */
            draw(ctx) {
                const alpha = Math.max(0, this.lifetime / this.maxLifetime);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                switch (this.shape) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -this.size);
                        ctx.lineTo(-this.size * 0.866, this.size * 0.5);
                        ctx.lineTo(this.size * 0.866, this.size * 0.5);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'diamond':
                        ctx.beginPath();
                        ctx.moveTo(0, -this.size);
                        ctx.lineTo(this.size, 0);
                        ctx.lineTo(0, this.size);
                        ctx.lineTo(-this.size, 0);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
                
                ctx.restore();
            }
        }

        /** Create ambient background particles */
        function createAmbientParticles() {
            state.ambientParticles = [];
            for (let i = 0; i < CONFIG.AMBIENT_PARTICLE_COUNT; i++) {
                const shapes = ['circle', 'triangle', 'diamond'];
                state.ambientParticles.push(new Particle(
                    Math.random() * CONFIG.CANVAS_WIDTH,
                    Math.random() * CONFIG.CANVAS_HEIGHT,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    Math.random() < 0.5 ? CONFIG.COLOR_PLAYER : CONFIG.COLOR_AI,
                    shapes[Math.floor(Math.random() * shapes.length)],
                    Infinity, // Never die
                    Math.random() * 4 + 2
                ));
            }
        }

        /** Spawn particles at position */
        function spawnParticles(x, y, color, count, shape) {
            for (let i = 0; i < count; i++) {
                if (state.particles.length >= CONFIG.MAX_PARTICLES) break;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.05 + 0.02;
                
                state.particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color,
                    shape || 'circle',
                    1000 + Math.random() * 500,
                    Math.random() * 3 + 1
                ));
            }
        }

        // === FLOATING TEXT ===
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.lifetime = 1500;
                this.maxLifetime = 1500;
            }

            /** Update floating text */
            update(deltaTime) {
                this.y -= deltaTime * 0.03;
                this.lifetime -= deltaTime;
            }

            /** Draw the floating text */
            draw(ctx) {
                const alpha = Math.max(0, this.lifetime / this.maxLifetime);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.font = 'bold 18px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // === RESONANCE ZONE ===
        const resonanceZone = {
            centerCol: 0,
            centerRow: 0,
            cells: [],
            targetCenterCol: 0,
            targetCenterRow: 0,
            moveProgress: 1,
            lastMoveTime: 0,
            pulsePhase: 0,
            particles: [],

            /** Initialize zone at center of arena */
            init() {
                this.centerCol = Math.floor(CONFIG.GRID_COLS / 2);
                this.centerRow = Math.floor(CONFIG.GRID_ROWS / 2);
                this.targetCenterCol = this.centerCol;
                this.targetCenterRow = this.centerRow;
                this.updateCells();
            },

            /** Update zone cells based on center position */
            updateCells() {
                this.cells = [{ col: this.centerCol, row: this.centerRow }];
                const neighbors = getNeighbors(this.centerCol, this.centerRow);
                this.cells.push(...neighbors.slice(0, 6));
            },

            /** Move to new random position */
            moveTo(currentTime) {
                if (this.moveProgress < 1) return;
                
                // Pick random position away from current
                let newCol, newRow;
                let attempts = 0;
                do {
                    newCol = Math.floor(Math.random() * (CONFIG.GRID_COLS - 4)) + 2;
                    newRow = Math.floor(Math.random() * (CONFIG.GRID_ROWS - 4)) + 2;
                    attempts++;
                } while (attempts < 20 && axialDistance(
                    { col: newCol, row: newRow },
                    { col: this.centerCol, row: this.centerRow }
                ) < 4);
                
                this.targetCenterCol = newCol;
                this.targetCenterRow = newRow;
                this.moveProgress = 0;
                this.lastMoveTime = currentTime;
                
                playSound('zoneMove');
            },

            /** Update zone state */
            update(deltaTime, currentTime) {
                this.pulsePhase += deltaTime * 0.004;
                
                // Update move animation
                if (this.moveProgress < 1) {
                    this.moveProgress += deltaTime / CONFIG.ZONE_MOVE_DURATION;
                    if (this.moveProgress >= 1) {
                        this.moveProgress = 1;
                        this.centerCol = this.targetCenterCol;
                        this.centerRow = this.targetCenterRow;
                        this.updateCells();
                    }
                }
                
                // Check if zone should move
                if (currentTime - this.lastMoveTime > CONFIG.ZONE_MOVE_INTERVAL) {
                    this.moveTo(currentTime);
                }
                
                // Spawn zone particles
                if (Math.random() < 0.1) {
                    const centerPos = this.getCenterPixelPosition();
                    spawnParticles(
                        centerPos.x + (Math.random() - 0.5) * 40,
                        centerPos.y + (Math.random() - 0.5) * 40,
                        CONFIG.COLOR_RESONANCE,
                        1,
                        Math.random() < 0.5 ? 'diamond' : 'triangle'
                    );
                }
            },

            /** Get interpolated center position */
            getCenterPixelPosition() {
                if (this.moveProgress >= 1) {
                    return hexToPixel(this.centerCol, this.centerRow);
                }
                
                const start = hexToPixel(this.centerCol, this.centerRow);
                const end = hexToPixel(this.targetCenterCol, this.targetCenterRow);
                const t = this.easeInOut(this.moveProgress);
                
                return {
                    x: start.x + (end.x - start.x) * t,
                    y: start.y + (end.y - start.y) * t
                };
            },

            /** Ease in-out function */
            easeInOut(t) {
                return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            },

            /** Draw the resonance zone */
            draw(ctx) {
                const pulseAlpha = 0.6 + 0.4 * Math.sin(this.pulsePhase);
                
                // Draw zone cells with glow
                for (const c of this.cells) {
                    let drawCol = c.col;
                    let drawRow = c.row;
                    
                    // Interpolate cell positions during move
                    if (this.moveProgress < 1) {
                        const offset = {
                            col: c.col - this.centerCol,
                            row: c.row - this.centerRow
                        };
                        
                        const startCenter = { col: this.centerCol, row: this.centerRow };
                        const endCenter = { col: this.targetCenterCol, row: this.targetCenterRow };
                        const t = this.easeInOut(this.moveProgress);
                        
                        drawCol = startCenter.col + offset.col + (endCenter.col - startCenter.col) * t;
                        drawRow = startCenter.row + offset.row + (endCenter.row - startCenter.row) * t;
                    }
                    
                    const pos = hexToPixel(Math.round(drawCol), Math.round(drawRow));
                    
                    // Outer glow
                    ctx.save();
                    ctx.globalAlpha = pulseAlpha * 0.3;
                    ctx.fillStyle = CONFIG.COLOR_RESONANCE;
                    ctx.shadowColor = CONFIG.COLOR_RESONANCE;
                    ctx.shadowBlur = 30;
                    this.drawHexCell(ctx, pos.x, pos.y, CONFIG.HEX_SIZE + 2);
                    ctx.fill();
                    ctx.restore();
                    
                    // Inner fill
                    ctx.save();
                    ctx.globalAlpha = pulseAlpha * 0.5;
                    const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, CONFIG.HEX_SIZE);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(1, CONFIG.COLOR_RESONANCE);
                    ctx.fillStyle = gradient;
                    this.drawHexCell(ctx, pos.x, pos.y, CONFIG.HEX_SIZE - 2);
                    ctx.fill();
                    ctx.restore();
                    
                    // Border
                    ctx.save();
                    ctx.globalAlpha = pulseAlpha;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = CONFIG.COLOR_RESONANCE;
                    ctx.shadowBlur = 15;
                    this.drawHexCell(ctx, pos.x, pos.y, CONFIG.HEX_SIZE);
                    ctx.stroke();
                    ctx.restore();
                }
            },

            /** Draw hexagon cell */
            drawHexCell(ctx, x, y, size) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                    const px = x + Math.cos(angle) * size;
                    const py = y + Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
            },

            /** Evaluate scoring */
            evaluateScore(currentTime) {
                const stats = getZoneStats();
                
                // Determine zone status
                if (stats.neutral > 0.5) {
                    state.zoneStatus = 'NEUTRAL';
                    return;
                }
                
                const centerPos = this.getCenterPixelPosition();
                
                // Check for harmony (mixed ownership)
                if (stats.contested > 0 || (stats.player > 0.1 && stats.ai > 0.1 && stats.player < 0.8 && stats.ai < 0.8)) {
                    // Harmony bonus!
                    state.scores.player += CONFIG.HARMONY_SCORE;
                    state.scores.ai += CONFIG.HARMONY_SCORE;
                    state.harmonyBonuses.player++;
                    state.harmonyBonuses.ai++;
                    state.zoneStatus = '⚡ HARMONY ACTIVE ⚡';
                    
                    state.floatingTexts.push(new FloatingText(
                        centerPos.x,
                        centerPos.y,
                        `+${CONFIG.HARMONY_SCORE} HARMONY!`,
                        CONFIG.COLOR_RESONANCE
                    ));
                    
                    // Golden particle burst
                    spawnParticles(centerPos.x, centerPos.y, CONFIG.COLOR_RESONANCE, 15, 'diamond');
                    
                    playSound('harmony');
                } else if (stats.player >= CONFIG.ZONE_CONTROL_THRESHOLD) {
                    // Player solo control
                    state.scores.player += CONFIG.SOLO_SCORE;
                    state.zoneStatus = 'PLAYER CONTROL';
                    
                    state.floatingTexts.push(new FloatingText(
                        centerPos.x,
                        centerPos.y,
                        `+${CONFIG.SOLO_SCORE}`,
                        CONFIG.COLOR_PLAYER
                    ));
                    
                    playSound('score');
                } else if (stats.ai >= CONFIG.ZONE_CONTROL_THRESHOLD) {
                    // AI solo control
                    state.scores.ai += CONFIG.SOLO_SCORE;
                    state.zoneStatus = 'AI CONTROL';
                    
                    state.floatingTexts.push(new FloatingText(
                        centerPos.x,
                        centerPos.y,
                        `+${CONFIG.SOLO_SCORE}`,
                        CONFIG.COLOR_AI
                    ));
                    
                    playSound('score');
                } else {
                    state.zoneStatus = 'CONTESTED';
                }
            }
        };

        // === AUDIO ===
        let audioCtx = null;

        /** Initialize audio context */
        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.log('Web Audio not available');
            }
        }

        /** Play a sound effect */
        function playSound(type) {
            if (!audioCtx) return;
            
            try {
                switch (type) {
                    case 'move':
                        playTone(440, 0.05, 0.05, 'sine');
                        break;
                    case 'claim':
                        playTone(880, 0.08, 0.08, 'triangle');
                        break;
                    case 'score':
                        playTone(660, 0.1, 0.15, 'sine');
                        break;
                    case 'harmony':
                        // Ascending chord
                        playTone(440, 0.15, 0.2, 'sine');
                        setTimeout(() => playTone(554, 0.15, 0.15, 'sine'), 50);
                        setTimeout(() => playTone(659, 0.15, 0.15, 'sine'), 100);
                        break;
                    case 'zoneMove':
                        playNoise(0.1, 0.3);
                        break;
                    case 'countdown':
                        playTone(330, 0.15, 0.2, 'sine');
                        break;
                    case 'start':
                        playTone(440, 0.2, 0.3, 'sine');
                        setTimeout(() => playTone(660, 0.2, 0.3, 'sine'), 100);
                        break;
                }
            } catch (e) {
                // Ignore audio errors
            }
        }

        /** Play a tone */
        function playTone(frequency, volume, duration, type) {
            if (!audioCtx) return;
            
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = frequency;
                
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Ignore
            }
        }

        /** Play filtered noise (for whoosh sounds) */
        function playNoise(volume, duration) {
            if (!audioCtx) return;
            
            try {
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;
                
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                source.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                source.start();
            } catch (e) {
                // Ignore
            }
        }

        // === RENDERER ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = CONFIG.CANVAS_WIDTH;
        canvas.height = CONFIG.CANVAS_HEIGHT;

        /** Draw background */
        function drawBackground() {
            ctx.fillStyle = CONFIG.COLOR_BACKGROUND;
            ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        }

        /** Draw hex grid */
        function drawGrid(currentTime) {
            const gridPulse = Math.sin(currentTime * 0.0003) * 0.1;
            
            for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                    const cell = state.cells[col]?.[row];
                    if (!cell) continue;
                    
                    const pos = hexToPixel(col, row);
                    
                    // Cell fill based on owner
                    if (cell.owner !== 'neutral') {
                        ctx.save();
                        
                        let color;
                        switch (cell.owner) {
                            case 'player':
                                color = CONFIG.COLOR_PLAYER;
                                break;
                            case 'ai':
                                color = CONFIG.COLOR_AI;
                                break;
                            case 'contested':
                                color = CONFIG.COLOR_CONTESTED;
                                break;
                        }
                        
                        // Calculate fade based on time since last visit
                        const elapsed = currentTime - cell.lastVisited;
                        const maxTime = cell.owner === 'contested' ? CONFIG.CONTESTED_DECAY_TIME : CONFIG.CELL_DECAY_TIME;
                        const fade = Math.max(0, 1 - elapsed / maxTime);
                        
                        ctx.globalAlpha = 0.4 * fade;
                        ctx.fillStyle = color;
                        ctx.shadowColor = color;
                        ctx.shadowBlur = 10;
                        
                        drawHexCell(ctx, pos.x, pos.y, CONFIG.HEX_SIZE - 1);
                        ctx.fill();
                        
                        // Bright border
                        ctx.globalAlpha = 0.8 * fade;
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 2;
                        drawHexCell(ctx, pos.x, pos.y, CONFIG.HEX_SIZE - 1);
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                    
                    // Grid lines
                    ctx.save();
                    ctx.globalAlpha = 0.3 + gridPulse;
                    ctx.strokeStyle = CONFIG.COLOR_GRID_LINE;
                    ctx.lineWidth = 1;
                    drawHexCell(ctx, pos.x, pos.y, CONFIG.HEX_SIZE);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        /** Draw hex cell helper */
        function drawHexCell(ctx, x, y, size) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                const px = x + Math.cos(angle) * size;
                const py = y + Math.sin(angle) * size;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }

        /** Draw ambient particles */
        function drawAmbientParticles(deltaTime) {
            for (const p of state.ambientParticles) {
                // Update position (wrap around)
                p.x += p.vx * deltaTime;
                p.y += p.vy * deltaTime;
                
                if (p.x < 0) p.x = CONFIG.CANVAS_WIDTH;
                if (p.x > CONFIG.CANVAS_WIDTH) p.x = 0;
                if (p.y < 0) p.y = CONFIG.CANVAS_HEIGHT;
                if (p.y > CONFIG.CANVAS_HEIGHT) p.y = 0;
                
                p.rotation += deltaTime * 0.0005;
                
                ctx.save();
                ctx.globalAlpha = 0.05 + Math.random() * 0.03;
                ctx.fillStyle = p.color;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                
                switch (p.shape) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -p.size);
                        ctx.lineTo(-p.size * 0.866, p.size * 0.5);
                        ctx.lineTo(p.size * 0.866, p.size * 0.5);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'diamond':
                        ctx.beginPath();
                        ctx.moveTo(0, -p.size);
                        ctx.lineTo(p.size, 0);
                        ctx.lineTo(0, p.size);
                        ctx.lineTo(-p.size, 0);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
                
                ctx.restore();
            }
        }

        /** Draw particles */
        function drawParticles(deltaTime) {
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.update(deltaTime);
                
                if (p.lifetime <= 0) {
                    state.particles.splice(i, 1);
                } else {
                    p.draw(ctx);
                }
            }
        }

        /** Draw floating texts */
        function drawFloatingTexts(deltaTime) {
            for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
                const t = state.floatingTexts[i];
                t.update(deltaTime);
                
                if (t.lifetime <= 0) {
                    state.floatingTexts.splice(i, 1);
                } else {
                    t.draw(ctx);
                }
            }
        }

            const seconds = Math.floor(state.timer % 60);
            ctx.fillText(`${minutes}:${seconds.toString().padStart(2, '0')}`, CONFIG.CANVAS_WIDTH / 2, 60);

            // Zone status

            } else {

                ctx.globalAlpha = 0.5;
            }
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.zoneStatus, CONFIG.CANVAS_WIDTH / 2, 80);
            ctx.restore();
        }

        /** Draw start screen */
        function drawStartScreen(currentTime) {
            drawBackground();
            drawAmbientParticles(16);
            
            // Draw live grid preview
            ctx.save();
            ctx.globalAlpha = 0.3;
            drawGrid(currentTime);
            ctx.restore();
            
            // Animated title
            const title = 'RESONANCE GRID';

            for (let i = 0; i < title.length; i++) {

                // Glow

        /** Draw countdown */
        function drawCountdown() {

            if (diff <= 2) {

                winnerColor = CONFIG.COLOR_RESONANCE;
                
                // Special harmony animation
                if (Math.random() < 0.1) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 50 + Math.random() * 100;
                    spawnParticles(

            } else if (state.scores.player > state.scores.ai) {

            } else {
                winner = 'AI WINS';
                winnerColor = CONFIG.COLOR_AI;
            }
            
            ctx.save();
            ctx.fillStyle = winnerColor;
            ctx.font = 'bold 32px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = winnerColor;
            ctx.shadowBlur = 20;
            ctx.fillText(winner, CONFIG.CANVAS_WIDTH / 2, 300);
            ctx.restore();
            
            // Stats
            ctx.save();
            ctx.fillStyle = CONFIG.COLOR_HUD;
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.globalAlpha = 0.7;
            
            ctx.fillText(`Total Harmony Bonuses: ${state.harmonyBonuses.player + state.harmonyBonuses.ai}`, CONFIG.CANVAS_WIDTH / 2, 380);
            ctx.fillText(`Territory Claimed: Player ${state.territoryClaimed.player} | AI ${state.territoryClaimed.ai}`, CONFIG.CANVAS_WIDTH / 2, 410);
            ctx.restore();
            
            // Restart prompt
            const pulseAlpha = 0.5 + 0.5 * Math.sin(currentTime * 0.005);
            ctx.save();
            ctx.fillStyle = CONFIG.COLOR_RESONANCE;
            ctx.font = 'bold 18px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.globalAlpha = pulseAlpha;
            ctx.shadowColor = CONFIG.COLOR_RESONANCE;
            ctx.shadowBlur = 10;
            ctx.fillText('PRESS SPACE TO PLAY AGAIN', CONFIG.CANVAS_WIDTH / 2, 500);
            ctx.restore();
            
            // Draw particles
            drawParticles(16);
        }

        // === GAME LOOP ===

        /** Initialize game state */
        function initGame() {
            // Initialize cells
            state.cells = [];
            for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                state.cells[col] = [];
                for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                    state.cells[col][row] = new Cell(col, row);
                }
            }
            
            // Initialize player
            state.player = new Entity(2, Math.floor(CONFIG.GRID_ROWS / 2), 'player');
            
            // Initialize AI
            state.ai = new Entity(CONFIG.GRID_COLS - 3, Math.floor(CONFIG.GRID_ROWS / 2), 'ai');
            
            // Initialize resonance zone
            state.resonanceZone = resonanceZone;
            resonanceZone.init();
            resonanceZone.lastMoveTime = performance.now();
            
            // Reset state
            state.scores = { player: 0, ai: 0 };
            state.timer = CONFIG.MATCH_DURATION;
            state.particles = [];
            state.floatingTexts = [];
            state.harmonyBonuses = { player: 0, ai: 0 };
            state.territoryClaimed = { player: 0, ai: 0 };
            state.lastScoreCheck = performance.now();
            state.zoneStatus = 'NEUTRAL';
            
            // Initialize ambient particles
            createAmbientParticles();
            
            // Claim starting cells
            const now = performance.now();
            state.cells[state.player.col][state.player.row].claim('player', now);
            state.cells[state.ai.col][state.ai.row].claim('ai', now);
        }

        /** Update game state */
        function update(deltaTime, currentTime) {
            if (state.phase === 'countdown') {
                state.countdownTimer += deltaTime;
                
                if (state.countdownTimer > 1000) {
                    state.countdownTimer = 0;
                    state.countdownValue--;
                    
                    if (state.countdownValue < 0) {
                        state.phase = 'playing';
                        state.lastScoreCheck = currentTime;
                        playSound('start');
                    } else {
                        playSound('countdown');
                    }
                }
                return;
            }
            
            if (state.phase !== 'playing') return;
            
            // Update timer
            state.timer -= deltaTime / 1000;
            if (state.timer <= 0) {
                state.timer = 0;
                state.phase = 'end';
                
                // Count territory
                for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                    for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                        const cell = state.cells[col][row];
                        if (cell.owner === 'player') state.territoryClaimed.player++;
                        else if (cell.owner === 'ai') state.territoryClaimed.ai++;
                    }
                }
                return;
            }
            
            // Update cells
            for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                    state.cells[col][row].update(currentTime);
                }
            }
            
            // Update entities
            state.player.update(deltaTime, currentTime);
            state.ai.update(deltaTime, currentTime);
            
            // AI decision making
            const nextCell = aiBrain.chooseNextCell(currentTime);
            if (nextCell && state.ai.moveProgress >= 1) {
                state.ai.moveTo(nextCell.col, nextCell.row, currentTime);
            }
            
            // Update resonance zone
            state.resonanceZone.update(deltaTime, currentTime);
            
            // Score evaluation every 2 seconds
            if (currentTime - state.lastScoreCheck >= CONFIG.SCORE_INTERVAL) {
                state.resonanceZone.evaluateScore(currentTime);
                state.lastScoreCheck = currentTime;
            }
        }

        /** Render frame */
        function render(currentTime, deltaTime) {
            switch (state.phase) {
                case 'start':
                    drawStartScreen(currentTime);
                    break;
                    
                case 'countdown':
                    drawBackground();
                    drawAmbientParticles(deltaTime);
                    drawGrid(currentTime);
                    state.resonanceZone.draw(ctx);
                    state.player.draw(ctx);
                    state.ai.draw(ctx);
                    drawCountdown();
                    break;
                    
                case 'playing':
                    drawBackground();
                    drawAmbientParticles(deltaTime);
                    drawGrid(currentTime);
                    state.resonanceZone.draw(ctx);
                    state.player.draw(ctx);
                    state.ai.draw(ctx);
                    drawParticles(deltaTime);
                    drawFloatingTexts(deltaTime);
                    drawHUD();
                    break;
                    
                case 'end':
                    drawEndScreen(currentTime);
                    break;
            }
        }

        /** Main game loop */
        function gameLoop(currentTime) {
            const deltaTime = currentTime - state.lastTime;
            state.lastTime = currentTime;
            
            // Cap deltaTime to prevent large jumps
            const cappedDelta = Math.min(deltaTime, 50);
            
            update(cappedDelta, currentTime);
            render(currentTime, cappedDelta);
            
            requestAnimationFrame(gameLoop);
        }

        // === INPUT HANDLER ===
        const keysPressed = {};

        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            
            const key = e.key;
            keysPressed[key] = true;
            
            // Space bar handling
            if (key === ' ') {
                e.preventDefault();
                
                if (state.phase === 'start') {
                    initGame();
                    state.phase = 'countdown';
                    state.countdownValue = 3;
                    state.countdownTimer = 0;
                    initAudio();
                } else if (state.phase === 'end') {
                    initGame();
                    state.phase = 'countdown';
                    state.countdownValue = 3;
                    state.countdownTimer = 0;
                }
            }
            
            // Arrow key movement
            if (state.phase === 'playing') {
                const currentTime = performance.now();
                
                switch (key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        state.player.move('up', currentTime);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        state.player.move('down', currentTime);
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        state.player.move('left', currentTime);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        state.player.move('right', currentTime);
                        break;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keysPressed[e.key] = false;
        });

        // === WINDOW RESIZE ===
        function handleResize() {
            // Keep canvas centered
            canvas.style.marginLeft = 'auto';
            canvas.style.marginRight = 'auto';
        }

        window.addEventListener('resize', handleResize);

        // === INITIALIZATION ===
        createAmbientParticles();
        
        // Initialize cells for start screen preview
        state.cells = [];
        for (let col = 0; col < CONFIG.GRID_COLS; col++) {
            state.cells[col] = [];
            for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                state.cells[col][row] = new Cell(col, row);
            }
        }
        
        // Start game loop
        state.lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    })();
    </script>
</body>
</html>
